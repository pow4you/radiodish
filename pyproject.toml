[project]
name = "radiodish-workspace"
version = "0.0.1"
description = "Workspace root for radiodish -- see packages/radiodish and packages/radiodish-actor for the actual publishable packages. This root itself is not published."
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
]

[tool.coverage.run]
source = ["radiodish", "radioactor"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
