[project]
name = "radiodish"
version = "2.0.0"
description = "A standalone, async RADIO-DISH implementation over UDP (ZeroMQ RFC 48), with automatic peer discovery and autowiring."
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/pow4you/radiodish"
Documentation = "https://github.com/pow4you/radiodish/blob/main/packages/radiodish/docs/index.md"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radiodish", "radiodish._internal", "radiodish.autowire"]

[tool.setuptools.package-dir]
radiodish = "src"
"radiodish._internal" = "src/_internal"
"radiodish.autowire" = "src/autowire"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

