[project]
name = "radiodish-actor"
version = "1.0.1"
description = "An Erlang-actor-model-flavored layer on top of radiodish -- group-addressed message dispatch over an autowired RADIO-DISH mesh."
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["radiodish>=2.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pow4you/radiodish"
Documentation = "https://github.com/pow4you/radiodish/blob/main/packages/radiodish-actor/docs/index.md"

[tool.uv.sources]
radiodish = { workspace = true }

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radioactor"]

[tool.setuptools.package-dir]
radioactor = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
